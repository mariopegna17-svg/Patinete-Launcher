<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Explorador BLE</title>
  <style>
    body {
      font-family: sans-serif;
      background: #0a0f1a;
      color: #e0f0ff;
      padding: 20px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #3b82f6;
      color: white;
      cursor: pointer;
    }
    #log {
      margin-top: 20px;
      background: #111827;
      padding: 15px;
      border-radius: 10px;
      white-space: pre-wrap;
      font-size: 0.9rem;
      max-height: 500px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <h1>Explorador BLE - Mostrar UUIDs</h1>
  <button onclick="scanBLE()">Buscar dispositivo BLE</button>
  <div id="log"></div>

  <script>
    const logBox = document.getElementById('log');

    function log(msg) {
      console.log(msg);
      logBox.textContent += msg + '\n';
      logBox.scrollTop = logBox.scrollHeight;
    }

    async function scanBLE() {
      try {
        log('Solicitando dispositivo BLE...');
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: []
        });

        log(`Dispositivo seleccionado: ${device.name || '(sin nombre)'}`);
        const server = await device.gatt.connect();
        log('Conectado. Obteniendo servicios...');

        const services = await server.getPrimaryServices();
        for (const service of services) {
          log(`\n🔧 Servicio: ${service.uuid}`);
          const characteristics = await service.getCharacteristics();
          for (const char of characteristics) {
            let props = [];
            for (const prop in char.properties) {
              if (char.properties[prop]) props.push(prop);
            }
            log(`  ↳ Characteristic: ${char.uuid}`);
            log(`     Propiedades: ${props.join(', ') || '—'}`);
          }
        }

        log('\n✅ Exploración completada.');
      } catch (error) {
        log('❌ Error: ' + error);
      }
    }
  </script>
</body>
</html>
