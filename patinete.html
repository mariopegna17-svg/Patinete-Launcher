<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TwoFish V1 Max Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    background: #000;
    color: #00ffcc;
    font-family: Arial, sans-serif;
    text-align: center;
}
.speed {
    font-size: 96px;
    margin-top: 40px;
}
.unit {
    font-size: 20px;
}
.battery {
    font-size: 22px;
    margin-top: 20px;
}
button {
    margin-top: 30px;
    padding: 15px 30px;
    font-size: 18px;
    background: #00ffcc;
    border: none;
    border-radius: 12px;
}
.status {
    margin-top: 15px;
    color: #aaa;
}
</style>
</head>

<body>

<div class="speed" id="speed">--</div>
<div class="unit">km/h</div>
<div class="battery" id="battery">Batería: --%</div>

<button onclick="connect()">Conectar TwoFish</button>
<div class="status" id="status">Desconectado</div>

<script>
let characteristic;

// UUIDs típicos TwoFish / genéricos chinos
const SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
const CHARACTERISTIC_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

async function connect() {
    try {
        const device = await navigator.bluetooth.requestDevice({
            filters: [{ services: [SERVICE_UUID] }]
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService(SERVICE_UUID);
        characteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

        await characteristic.startNotifications();
        characteristic.addEventListener('characteristicvaluechanged', onData);

        document.getElementById("status").innerText = "Conectado";
    } catch (e) {
        document.getElementById("status").innerText = "Error: " + e;
    }
}

function onData(event) {
    const d = new Uint8Array(event.target.value.buffer);

    /*
      Formato habitual TwoFish:
      d[0] + d[1] → velocidad (km/h * 10)
      d[2]        → batería %
    */

    const speed = ((d[1] << 8) | d[0]) / 10;
    const battery = d[2];

    document.getElementById("speed").innerText = speed.toFixed(0);
    document.getElementById("battery").innerText = "Batería: " + battery + "%";
}
</script>

</body>
</html>
